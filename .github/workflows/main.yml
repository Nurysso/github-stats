name: Generate Stats Images

on:
  schedule:
    - cron: '5 0 * * 1' # weekly, Mondays at 00:05 UTC
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    env:
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      # Scheduled runs set GITHUB_ACTOR to whoever last touched the workflow,
      # so use the repo owner explicitly.
      GITHUB_USERNAME: ${{ github.repository_owner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'

      - name: Install requirements
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install -r requirements.txt
          python3 -m pip install requests PyGithub

      - name: Generate images
        run: python3 generate_images.py
        env:
          EXCLUDED: ${{ secrets.EXCLUDED }}
          EXCLUDED_LANGS: ${{ secrets.EXCLUDED_LANGS }}
          EXCLUDE_FORKED_REPOS: true

      - name: Run clone tracker script
        run: python3 track_clones.py

      - name: Run star tracker script
        run: python3 track_stars.py

      - name: Debug generated output
        run: |
          echo "=== generated/ ==="
          ls -la generated/ || echo "generated/ directory missing"
          echo "=== data/ ==="
          ls -la data/ || echo "data/ directory missing"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-stats[bot]"
          git config --global user.email "github-stats[bot]@users.noreply.github.com"
          git add generated/ data/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update statistics - $(date +'%Y-%m-%d %H:%M:%S UTC')"
            git pull --rebase
            git push
          fi
