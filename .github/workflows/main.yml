name: Generate Stats Images

on:
  push:
    branches: [master]
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Generate images
        run: uv run generate_images.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          EXCLUDED: ${{ secrets.EXCLUDED }}
          EXCLUDED_LANGS: ${{ secrets.EXCLUDED_LANGS }}
          EXCLUDE_FORKED_REPOS: true

      - name: Debug generated output
        run: ls -la generated/ || echo "generated/ directory missing"

      - name: Upload generated images
        uses: actions/upload-artifact@v4
        with:
          name: generated-images
          path: generated/
          retention-days: 1

  track-clones:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Run clone tracker script
        run: uv run track_clones.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Debug clone data output
        run: ls -la data/ || echo "data/ directory missing"

      - name: Upload clone data
        uses: actions/upload-artifact@v4
        with:
          name: clone-data
          path: data/
          retention-days: 1

  track-stars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Run star tracker script
        run: uv run track_stars.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Debug star data output
        run: ls -la data/ || echo "data/ directory missing"

      - name: Upload star data
        uses: actions/upload-artifact@v4
        with:
          name: star-data
          path: data/
          retention-days: 1

  commit-changes:
    runs-on: ubuntu-latest
    needs: [generate-images, track-clones, track-stars]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated images
        uses: actions/download-artifact@v4
        with:
          name: generated-images
          path: generated/
        continue-on-error: true

      - name: Download clone data
        uses: actions/download-artifact@v4
        with:
          name: clone-data
          path: data/
        continue-on-error: true

      - name: Download star data
        uses: actions/download-artifact@v4
        with:
          name: star-data
          path: data/
        continue-on-error: true

      - name: Debug all downloaded files
        run: |
          echo "=== generated/ ==="
          ls -la generated/ || echo "generated/ missing"
          echo "=== data/ ==="
          ls -la data/ || echo "data/ missing"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-stats[bot]"
          git config --global user.email "github-stats[bot]@users.noreply.github.com"
          git add generated/ data/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update statistics - $(date +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
